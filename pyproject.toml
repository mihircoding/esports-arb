[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "esports-arb"
version = "0.1.0"
description = "Fee-aware, depth-aware arbitrage scanner for esports match markets on Kalshi, Polymarket and sportsbooks"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
license = {text = "MIT"}
authors = [{name = "Mihir Konda"}]

[project.optional-dependencies]
research = ["pandas>=2", "numpy>=1.24", "matplotlib>=3.7"]
dev = ["pytest>=7"]

[project.scripts]
esports-arb = "esports_arb.cli:main"

[tool.setuptools.packages.find]
include = ["esports_arb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
